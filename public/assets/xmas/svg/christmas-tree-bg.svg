  <circle cx="400" cy="760" r="12" fill="#E8C16A"/>
  <circle cx="400" cy="760" r="18" fill="url(#glow-gold)" opacity="0.5"/>
  <circle cx="480" cy="740" r="12" fill="#FF4444"/>
