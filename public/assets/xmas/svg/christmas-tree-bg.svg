  <circle cx="700" cy="490" r="12" fill="#FF4444"/>
  <circle cx="700" cy="490" r="18" fill="url(#glow-red)" opacity="0.5"/>
  <circle cx="780" cy="510" r="12" fill="#E8C16A"/>
  <circle cx="780" cy="510" r="18" fill="url(#glow-gold)" opacity="0.5"/>

  <!-- Row 4 -->
  <circle cx="470" cy="390" r="12" fill="#E8C16A"/>
  <circle cx="470" cy="390" r="18" fill="url(#glow-gold)" opacity="0.5"/>
  <circle cx="540" cy="370" r="12" fill="#FF4444"/>
  <circle cx="540" cy="370" r="18" fill="url(#glow-red)" opacity="0.5"/>
