<svg width="1200" height="1000" viewBox="0 0 1200 1000" xmlns="http://www.w3.org/2000/svg">
  <!-- Background gradient -->
  <defs>
    <radialGradient id="glow-gold" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#FFD700;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#FFD700;stop-opacity:0" />
    </radialGradient>
    <radialGradient id="glow-red" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#FF0000;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#FF0000;stop-opacity:0" />
    </radialGradient>
    <linearGradient id="tree-gradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1F3D2B;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0F2D1B;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Tree trunk -->
  <rect x="560" y="820" width="80" height="120" fill="#4A2511" rx="5"/>
  <rect x="565" y="825" width="70" height="110" fill="#5D3319" rx="3"/>

  <!-- Tree layers (bottom to top) -->
  <!-- Layer 5 - Bottom -->
  <path d="M 600 820 L 300 820 L 450 650 L 400 650 L 600 400 L 800 650 L 750 650 L 900 820 Z"
        fill="url(#tree-gradient)" stroke="#1A3321" stroke-width="2"/>

  <!-- Layer 4 -->
  <path d="M 600 680 L 350 680 L 470 550 L 430 550 L 600 350 L 770 550 L 730 550 L 850 680 Z"
        fill="url(#tree-gradient)" stroke="#1A3321" stroke-width="2"/>

  <!-- Layer 3 -->
  <path d="M 600 550 L 400 550 L 490 450 L 460 450 L 600 300 L 740 450 L 710 450 L 800 550 Z"
        fill="url(#tree-gradient)" stroke="#1A3321" stroke-width="2"/>

  <!-- Layer 2 -->
  <path d="M 600 430 L 450 430 L 510 360 L 490 360 L 600 250 L 710 360 L 690 360 L 750 430 Z"
        fill="url(#tree-gradient)" stroke="#1A3321" stroke-width="2"/>

  <!-- Layer 1 - Top -->
  <path d="M 600 320 L 500 320 L 540 270 L 600 200 L 660 270 L 700 320 Z"
        fill="url(#tree-gradient)" stroke="#1A3321" stroke-width="2"/>

  <!-- Star on top -->
