          fill="#E8C16A" stroke="#D4A843" stroke-width="2"/>
    <circle cx="0" cy="-15" r="35" fill="url(#glow-gold)" opacity="0.4"/>
  </g>

  <!-- String lights garland - swooping across tree -->
