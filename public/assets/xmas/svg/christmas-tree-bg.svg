  <circle cx="420" cy="510" r="18" fill="url(#glow-red)" opacity="0.5"/>
  <circle cx="500" cy="490" r="12" fill="#E8C16A"/>
  <circle cx="500" cy="490" r="18" fill="url(#glow-gold)" opacity="0.5"/>
